<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정산 시스템 ERD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 500; color: #2c2c2a; margin-bottom: 20px; }
  #erd-wrap { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #e0dfd6; }
  #erd-wrap svg { width: 100%; }
</style>
</head>
<body>
<h1>정산 시스템 ERD</h1>
<div id="erd-wrap"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '13px',
    lineColor: '#73726c',
    textColor: '#3d3d3a',
    primaryColor: '#EEEDFE',
    primaryTextColor: '#3C3489',
    primaryBorderColor: '#AFA9EC',
    secondaryColor: '#E1F5EE',
    tertiaryColor: '#F1EFE8',
  },
});

const diagram = `erDiagram
  User {
    INT user_id PK
    VARCHAR name
    VARCHAR bank_code
    VARCHAR account_number
    VARCHAR access_token
  }
  Moim {
    INT moim_id PK
    VARCHAR moim_name
    DATETIME created_at
    INT leader_id FK
  }
  Moim_Member {
    INT moim_id FK
    INT user_id FK
  }
  Round {
    INT round_id PK
    INT moim_id FK
    INT round_number
    VARCHAR location_name
    INT total_amount
  }
  Round_Member {
    INT round_id FK
    INT user_id FK
  }
  Settlement_Result {
    INT settlement_id PK
    INT moim_id FK
    INT sender_id FK
    INT receiver_id FK
    INT amount
    VARCHAR deposit_memo
    VARCHAR status
    DATETIME updated_at
  }

  User ||--o{ Moim : "leads (leader_id)"
  User ||--o{ Moim_Member : "joins"
  Moim ||--o{ Moim_Member : "has members"
  Moim ||--o{ Round : "has rounds"
  Round ||--o{ Round_Member : "has participants"
  User ||--o{ Round_Member : "attends"
  Moim ||--o{ Settlement_Result : "settles"
  User ||--o{ Settlement_Result : "sends (sender_id)"
  User ||--o{ Settlement_Result : "receives (receiver_id)"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd-wrap').innerHTML = svg;

document.querySelectorAll('#erd-wrap .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd-wrap .row-rect-odd path, #erd-wrap .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
</body>
</html>
